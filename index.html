<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Nia & Irfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF7F2;
            --bg-secondary: #EFE8DE;
            --text-dark: #3D352E;
            --accent: #8C6D4F;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Cover Overlay */
        #cover {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(61, 53, 46, 0.6), rgba(61, 53, 46, 0.7)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
            padding: 2rem;
            transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
        }

        #cover.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        #cover p.subtitle {
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        #cover h1 {
            font-size: 3.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
        }

        .btn-open {
            background-color: var(--accent);
            color: var(--white);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-open:hover {
            background-color: #73573D;
        }

        /* Main Sections */
        section {
            padding: 5rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .bg-alt {
            background-color: var(--bg-secondary);
            max-width: 100%;
        }

        .bg-alt > .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* Couple Section */
        .couple-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
            margin-top: 2rem;
        }

        @media (min-width: 640px) {
            .couple-grid {
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
            }
        }

        .person h3 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .ampersand {
            font-size: 3rem;
            color: var(--accent);
        }

        /* Event Cards */
        .event-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        @media (min-width: 640px) {
            .event-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--white);
            padding: 2.5rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0
